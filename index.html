<!-- =========================
     GINECOLÓGICOS
     Después de Obstétricos
     ========================= -->
<div class="clinical-card mt-3">
  <div class="clinical-card-header">
    <i class="bi bi-gender-female"></i>
    Ginecológicos
  </div>

  <div class="table-responsive">
    <table class="table table-bordered align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th style="width:35%">Descripción</th>
          <th style="width:30%">Detalle</th>
          <th style="width:35%">Resultado</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>Menarquia (años)</td>
          <td>
            <input type="number" id="hcMenarquia" class="form-control">
          </td>
          <td>
            <input type="text" id="hcMenarquiaResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Menacme</td>
          <td>
            <input type="text" id="hcMenacme" class="form-control">
          </td>
          <td>
            <input type="text" id="hcMenacmeResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Menopausia</td>
          <td>
            <input type="text" id="hcMenopausia" class="form-control">
          </td>
          <td>
            <input type="text" id="hcMenopausiaResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Vida Sexual Activa</td>
          <td>
            <div class="d-flex gap-3">
              <label><input type="radio" name="hcVidaSexual" value="SI"> Sí</label>
              <label><input type="radio" name="hcVidaSexual" value="NO"> No</label>
            </div>
          </td>
          <td>
            <input type="text" id="hcVidaSexualResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Planificación Familiar</td>
          <td>
            <input type="text" id="hcPlanificacionFamiliar" class="form-control">
          </td>
          <td>
            <input type="text" id="hcPlanificacionResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Terapia Hormonal</td>
          <td>
            <input type="text" id="hcTerapiaHormonal" class="form-control">
          </td>
          <td>
            <input type="text" id="hcTerapiaHormonalResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Infecciones Vulvovaginales</td>
          <td>
            <input type="text" id="hcInfeccionesVulvovaginales" class="form-control">
          </td>
          <td>
            <input type="text" id="hcInfeccionesResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Antecedente de ETS</td>
          <td>
            <input type="text" id="hcETS" class="form-control">
          </td>
          <td>
            <input type="text" id="hcETSResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Mamografía</td>
          <td>
            <input type="date" id="hcMamografiaFecha" class="form-control">
          </td>
          <td>
            <input type="text" id="hcMamografiaResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Eco Mamario</td>
          <td>
            <input type="date" id="hcEcoMamarioFecha" class="form-control">
          </td>
          <td>
            <input type="text" id="hcEcoMamarioResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Densitometría Ósea</td>
          <td>
            <input type="date" id="hcDensitometriaFecha" class="form-control">
          </td>
          <td>
            <input type="text" id="hcDensitometriaResultado" class="form-control">
          </td>
        </tr>

        <tr>
          <td>Colposcopia</td>
          <td>
            <input type="date" id="hcColposcopiaFecha" class="form-control">
          </td>
          <td>
            <input type="text" id="hcColposcopiaResultado" class="form-control">
          </td>
        </tr>

      </tbody>
    </table>
  </div>
</div>
