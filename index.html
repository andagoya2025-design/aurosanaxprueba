<!-- =====================================================================
 AUROSANAX CLINICAL ERP
 HISTORIA CLÍNICA · INFORME CLÍNICO DE ATENCIÓN
 FASE 1 · V1 · PARCHE QUIRÚRGICO / REVERSIBLE
 Fecha: 2026-08-22

 ALCANCE:
 - Solo presentación del PDF generado por imprimirHistoriaClinica().
 - Conserva la función original y toda su recolección clínica.
 - NO modifica id_atencion.
 - NO guarda datos.
 - NO consulta Apps Script.
 - NO modifica Google Sheets.
 - NO toca Recetas, Certificados, Consentimientos, Plan, Diagnóstico,
   Obstetricia, Atenciones ni navegación.
 - Reutiliza Configuración ya cargada en window.auroConfiguracionCentro.
 - Reutiliza el resumen de Integración Clínica SOLO si corresponde
   exactamente a la misma id_atencion.
 - Reversible: retirar este bloque restaura el comportamiento anterior.
===================================================================== -->
<script id="auro-hc-informe-atencion-fase1-v1">
(function(){
  'use strict';

  if(window.__AURO_HC_INFORME_ATENCION_FASE1_V1__) return;
  window.__AURO_HC_INFORME_ATENCION_FASE1_V1__ = true;

  var imprimirOriginal = window.imprimirHistoriaClinica;

  if(typeof imprimirOriginal !== 'function'){
    console.error(
      'AUROSANAX HC FASE 1: no se encontró imprimirHistoriaClinica(). ' +
      'El parche no se instaló.'
    );
    return;
  }

  function texto(valor){
    return String(valor === null || valor === undefined ? '' : valor).trim();
  }

  function escapar(valor){
    if(typeof window.auroInformeEscape === 'function'){
      return window.auroInformeEscape(valor);
    }
    return String(valor === null || valor === undefined ? '' : valor)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function valorCampo(id){
    try{
      if(typeof window.auroInformeValue === 'function'){
        return texto(window.auroInformeValue(id));
      }
    }catch(e){}
    var el = document.getElementById(id);
    if(!el) return '';
    return texto(el.value || el.innerText || el.textContent);
  }

  function idAtencionActiva(){
    try{
      if(typeof window.auroHistoriaIdAtencionActivaSeguro === 'function'){
        var idSeguro = texto(window.auroHistoriaIdAtencionActivaSeguro());
        if(idSeguro) return idSeguro;
      }
    }catch(e){}

    try{
      if(typeof window.getIdAtencionActiva === 'function'){
        var idMaestro = texto(window.getIdAtencionActiva());
        if(idMaestro) return idMaestro;
      }
    }catch(e){}

    try{
      if(typeof window.getAtencionActiva === 'function'){
        var a = window.getAtencionActiva();
        if(a && texto(a.id_atencion)) return texto(a.id_atencion);
      }
    }catch(e){}

    return '';
  }

  function configuracionCentro(){
    var cfg = (
      window.auroConfiguracionCentro &&
      typeof window.auroConfiguracionCentro === 'object' &&
      !Array.isArray(window.auroConfiguracionCentro)
    ) ? window.auroConfiguracionCentro : {};

    var nombre = texto(
      cfg.nombre_clinica ||
      cfg.nombre_centro ||
      cfg.nombre_comercial ||
      cfg.razon_social ||
      'AUROSANAX'
    ) || 'AUROSANAX';

    var subtitulo = texto(
      cfg.subtitulo_clinica ||
      cfg.descripcion_clinica ||
      cfg.eslogan_clinica ||
      'Centro de atención médica'
    );

    var colorPrincipal = texto(cfg.color_principal || '#8b1e5a');
    var colorSecundario = texto(
      cfg.color_secundario ||
      cfg.color_complementario ||
      '#c23b83'
    );

    return {
      nombre:nombre,
      subtitulo:subtitulo,
      colorPrincipal:colorPrincipal,
      colorSecundario:colorSecundario,
      direccion:texto(cfg.direccion_clinica || cfg.direccion),
      telefono:texto(
        cfg.telefono_clinica ||
        cfg.whatsapp_clinica ||
        cfg.telefono ||
        cfg.whatsapp
      ),
      email:texto(
        cfg.email_clinica ||
        cfg.correo_clinica ||
        cfg.email ||
        cfg.correo
      ),
      web:texto(
        cfg.sitio_web_clinica ||
        cfg.web_clinica ||
        cfg.web
      )
    };
  }

  function resumenClinicoSeguro(){
    var id = idAtencionActiva();
    if(!id) return '';

    try{
      var st = window.auroDiagnosticosState;
      if(
        st &&
        texto(st.atencionActual) === id &&
        texto(st.resumenClinico)
      ){
        return texto(st.resumenClinico);
      }
    }catch(e){}

    /*
      Fallback estrictamente documental:
      no interpreta, no diagnostica y no inventa información.
      Solo sintetiza campos ya visibles de ESTA atención.
    */
    var motivo = valorCampo('hcMotivoConsulta');
    var enfermedad = valorCampo('hcEnfermedadActual');
    var dx = '';

    try{
      var body = document.getElementById('hcDxSeleccionadosBody');
      if(body){
        dx = texto(body.innerText)
          .replace(/\s+/g,' ')
          .replace(/sin diagn[oó]sticos?/ig,'')
          .trim();
      }
    }catch(e){}

    var partes = [];
    if(motivo) partes.push('Motivo de consulta: ' + motivo + '.');
    if(enfermedad) partes.push('Enfermedad actual: ' + enfermedad + '.');
    if(dx) partes.push('Diagnóstico registrado: ' + dx + '.');

    return partes.join(' ');
  }

  function resumenHTML(){
    var resumen = resumenClinicoSeguro();
    if(!resumen) return '';

    return [
      '<div class="auro-section-title auro-summary-title">',
        '<span>Resumen</span> Síntesis clínica de la atención',
      '</div>',
      '<section class="auro-summary-card">',
        '<div class="auro-summary-head">',
          '<div class="auro-summary-icon">RC</div>',
          '<div>',
            '<strong>Resumen clínico de la atención</strong>',
            '<small>Información integrada exclusivamente de la consulta seleccionada.</small>',
          '</div>',
        '</div>',
        '<div class="auro-summary-text">', escapar(resumen), '</div>',
      '</section>'
    ].join('');
  }

  function cssAdicional(cfg){
    return [
      '<style id="auroHcInformeAtencionFase1Css">',
      ':root{',
        '--auro-hc-primary:', cfg.colorPrincipal, ';',
        '--auro-hc-secondary:', cfg.colorSecundario, ';',
      '}',

      /* Documento maestro en escritorio; móvil conserva adaptación existente. */
      '@media screen and (min-width:850px){',
        '.auro-report{',
          'width:210mm!important;',
          'max-width:210mm!important;',
          'min-height:297mm!important;',
          'margin:18px auto!important;',
          'box-shadow:0 18px 42px rgba(15,23,42,.16)!important;',
        '}',
      '}',

      '.auro-header{',
        'background:linear-gradient(135deg,var(--auro-hc-primary),var(--auro-hc-secondary))!important;',
      '}',
      '.auro-section-title{color:var(--auro-hc-primary)!important;}',
      '.auro-section-title span{',
        'color:var(--auro-hc-primary)!important;',
        'background:#fff7fb!important;',
      '}',
      '.auro-report-icon{color:var(--auro-hc-primary)!important;}',
      '.auro-report-item{border-left-color:var(--auro-hc-secondary)!important;}',
      '.auro-rx-hc-dx{border-left-color:var(--auro-hc-secondary)!important;}',
      '.auro-rx-hc-line b{color:var(--auro-hc-primary)!important;}',

      '.auro-summary-card{',
        'margin:0 0 10px;',
        'border:1px solid #ead7e3;',
        'border-radius:16px;',
        'background:linear-gradient(135deg,#fff 0%,#fffafd 100%);',
        'overflow:hidden;',
        'box-shadow:0 5px 16px rgba(15,23,42,.035);',
        'break-inside:avoid;',
        'page-break-inside:avoid;',
      '}',
      '.auro-summary-head{',
        'display:flex;',
        'align-items:center;',
        'gap:9px;',
        'padding:9px 11px;',
        'border-bottom:1px solid #f1e5ed;',
      '}',
      '.auro-summary-icon{',
        'width:34px;',
        'height:34px;',
        'border-radius:11px;',
        'display:grid;',
        'place-items:center;',
        'flex:0 0 auto;',
        'font-size:11px;',
        'font-weight:900;',
        'color:var(--auro-hc-primary);',
        'background:#fdf2f8;',
        'border:1px solid #f4d4e5;',
      '}',
      '.auro-summary-head strong{',
        'display:block;',
        'font-size:13.5px;',
        'color:#111827;',
      '}',
      '.auro-summary-head small{',
        'display:block;',
        'margin-top:2px;',
        'font-size:10.5px;',
        'font-weight:650;',
        'color:#64748b;',
      '}',
      '.auro-summary-text{',
        'padding:10px 12px;',
        'font-size:12.2px;',
        'line-height:1.48;',
        'color:#263244;',
        'white-space:pre-wrap;',
      '}',

      '.auro-institution-foot{',
        'margin-top:6px;',
        'padding:7px 0 0;',
        'font-size:9.8px;',
        'line-height:1.4;',
        'color:#64748b;',
        'text-align:center;',
      '}',

      '@media print{',
        '@page{size:A4;margin:8mm;}',
        '.auro-report{',
          'width:auto!important;',
          'max-width:none!important;',
          'min-height:auto!important;',
          'margin:0!important;',
          'box-shadow:none!important;',
        '}',
        '.auro-summary-card{box-shadow:none!important;margin-bottom:5px!important;}',
        '.auro-summary-head{padding:5px 7px!important;}',
        '.auro-summary-text{padding:6px 8px!important;font-size:10.5px!important;line-height:1.3!important;}',
      '}',
      '</style>'
    ].join('');
  }

  function pieInstitucional(cfg){
    var datos = [
      cfg.direccion,
      cfg.telefono ? 'Tel. ' + cfg.telefono : '',
      cfg.email,
      cfg.web
    ].filter(Boolean);

    if(!datos.length) return '';
    return '<div class="auro-institution-foot">' +
      datos.map(escapar).join(' · ') +
    '</div>';
  }

  function transformarHTML(html){
    html = String(html || '');
    if(!html) return html;

    var cfg = configuracionCentro();
    var resumen = resumenHTML();

    /* Título documental: una atención, no toda la historia longitudinal. */
    html = html.replace(
      '<title>Historia Clínica AUROSANAX</title>',
      '<title>Informe Clínico de Atención · ' + escapar(cfg.nombre) + '</title>'
    );

    html = html.replace(
      '<h1>Historia Clínica Integral</h1>',
      '<h1>Informe Clínico de Atención</h1>'
    );

    html = html.replace(
      '<small>AUROSANAX Clinical ERP</small>',
      '<small>' + escapar(cfg.nombre) + ' · Clinical ERP</small>'
    );

    html = html.replace(
      '<p>Informe clínico profesional generado desde el ERP AUROSANAX</p>',
      '<p>Registro profesional correspondiente a la atención clínica seleccionada</p>'
    );

    html = html.replace(
      /<p>Historia clínica integral · AUROSANAX<\/p>/g,
      '<p>Atención clínica individual · ' + escapar(cfg.nombre) + '</p>'
    );

    /*
      Inserta el resumen ANTES de Anamnesis.
      No elimina ni mueve las secciones clínicas originales.
    */
    if(resumen){
      var marcadorConsulta =
        '<div class="auro-section-title"><span>Consulta</span> Anamnesis</div>';

      if(html.indexOf(marcadorConsulta) !== -1){
        html = html.replace(
          marcadorConsulta,
          resumen + marcadorConsulta
        );
      }
    }

    /* Identidad visual configurable sin alterar Configuración ni backend. */
    html = html.replace('</head>', cssAdicional(cfg) + '</head>');

    /* Pie institucional adicional, conservando el footer original. */
    var cierreReporte = '</div>\n</body>';
    if(html.indexOf(cierreReporte) !== -1){
      html = html.replace(
        cierreReporte,
        pieInstitucional(cfg) + '</div>\n</body>'
      );
    }

    /* Solo cambia la etiqueta estática del footer del informe. */
    html = html.replace(
      /AUROSANAX · Informe clínico generado en entorno ERP\./g,
      escapar(cfg.nombre) + ' · Informe clínico de atención generado en entorno ERP.'
    );

    return html;
  }

  window.imprimirHistoriaClinica = function(){
    var abrirVentanaReal = window.open;

    /*
      Intercepción localizada de window.open:
      - existe solo durante la ejecución de imprimirHistoriaClinica().
      - retorna la ventana real.
      - únicamente transforma el HTML que ESA función escribe.
      - se restaura inmediatamente en finally.
    */
    window.open = function(){
      var ventana = abrirVentanaReal.apply(window, arguments);
      if(!ventana || !ventana.document) return ventana;

      try{
        var writeReal = ventana.document.write.bind(ventana.document);

        ventana.document.write = function(html){
          return writeReal(transformarHTML(html));
        };
      }catch(error){
        console.warn(
          'AUROSANAX HC FASE 1: no se pudo aplicar la capa visual; ' +
          'se conserva el informe original.',
          error
        );
      }

      return ventana;
    };

    try{
      return imprimirOriginal.apply(this, arguments);
    }finally{
      window.open = abrirVentanaReal;
    }
  };

  /*
    Cambio visual del botón únicamente.
    Mantiene el mismo onclick="imprimirHistoriaClinica()".
  */
  function rotularBoton(){
    try{
      var botones = Array.from(
        document.querySelectorAll('button[onclick*="imprimirHistoriaClinica"]')
      );

      botones.forEach(function(btn){
        if(btn.dataset.auroHcInformeFase1 === '1') return;
        btn.dataset.auroHcInformeFase1 = '1';
        btn.innerHTML =
          '<i class="bi bi-file-earmark-medical me-1"></i> Informe de atención';
        btn.setAttribute(
          'title',
          'Generar informe clínico de la atención seleccionada'
        );
      });
    }catch(e){}
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', rotularBoton, {once:true});
  }else{
    rotularBoton();
  }

  console.info(
    'AUROSANAX HC: Informe Clínico de Atención Fase 1 V1 instalado. ' +
    'Alcance exclusivo de impresión.'
  );
})();
</script>
