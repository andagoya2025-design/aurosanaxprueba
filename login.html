<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUROSANAX ERP - Login</title>
<style>
:root{
 --primary:#7B3FF2;
 --secondary:#A66CFF;
 --bg:#F7F4FD;
 --text:#2D2D2D;
 --card:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:Segoe UI,Arial,sans-serif;
 background:linear-gradient(135deg,#ffffff,#f4efff,#ece7ff);
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.login-card{
 width:100%;
 max-width:430px;
 background:rgba(255,255,255,.95);
 backdrop-filter:blur(10px);
 border-radius:20px;
 box-shadow:0 18px 45px rgba(0,0,0,.12);
 padding:40px 32px;
}
#logoCentro{
 width:120px;
 height:120px;
 object-fit:contain;
 display:block;
 margin:0 auto 15px;
}
#nombreCentro{
 text-align:center;
 color:var(--primary);
 font-size:30px;
 font-weight:700;
}
#subtituloCentro{
 text-align:center;
 color:#777;
 margin:6px 0 30px;
}
.form-group{margin-bottom:18px}
label{display:block;margin-bottom:6px;font-weight:600;color:var(--text)}
input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:15px;
}
.password-box{position:relative}
#btnMostrarClave{
 position:absolute;
 right:12px;
 top:13px;
 border:none;
 background:none;
 cursor:pointer;
 font-size:18px;
}
#btnLogin{
 width:100%;
 padding:15px;
 border:none;
 border-radius:12px;
 background:linear-gradient(90deg,var(--primary),var(--secondary));
 color:#fff;
 font-size:16px;
 font-weight:700;
 cursor:pointer;
 transition:.2s;
}
#btnLogin:hover{transform:translateY(-1px)}
#lblError{
 display:none;
 margin-top:15px;
 background:#ffe9e9;
 color:#b00020;
 padding:12px;
 border-radius:10px;
}
.footer{
 margin-top:24px;
 text-align:center;
 color:#888;
 font-size:12px;
}
</style>
</head>
<body>
<div class="login-card">

<img id="logoCentro" src="" alt="Logo">

<h1 id="nombreCentro">AUROSANAX</h1>

<p id="subtituloCentro">ERP Clínico Inteligente</p>

<div class="form-group">
<label>Usuario</label>
<input id="txtUsuario" type="text" autocomplete="username">
</div>

<div class="form-group">
<label>Contraseña</label>
<div class="password-box">
<input id="txtClave" type="password" autocomplete="current-password">
<button id="btnMostrarClave" type="button">👁</button>
</div>
</div>

<button id="btnLogin">Iniciar sesión</button>

<div id="lblError"></div>

<div class="footer">
Versión 1.0 • © AUROSANAX
</div>

<script src="seguridad.js"></script>

</div>
</body>
</html>
